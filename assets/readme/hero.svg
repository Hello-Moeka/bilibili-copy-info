<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">动态卡片复制字段流程</title>
  <desc id="desc">从视频投稿卡片复制主播名、UID 与 BV 号，可直接粘贴到表格列。</desc>
  <rect width="1200" height="360" rx="24" fill="#F6F7F9"/>
  <text x="52" y="60" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#6E7784" letter-spacing="1.2">DYNAMIC / VIDEO</text><text x="52" y="111" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="37" font-weight="730" fill="#17191D">卡片内完成复制</text><text x="52" y="150" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="500" fill="#555C66">主播名 · UID · BV 号，按列粘贴</text><rect x="52" y="188" width="350" height="112" rx="16" fill="#FFFFFF" stroke="#E4E7EB" stroke-width="1"/><rect x="70" y="205" width="104" height="72" rx="10" fill="#D9E8F0"/><path d="M70 258L100 233L119 247L143 219L174 257" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="225" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#252A32">视频投稿卡片</text><text x="190" y="251" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="500" fill="#737C88">动态内容 / 无限滚动</text><rect x="286" y="259" width="98" height="32" rx="16" fill="#EAF6FC" stroke="#B8E5F4" stroke-width="1"/><text x="335.0" y="281" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="650" fill="#007EAE">复制</text><path d="M421 241L522 241" fill="none" stroke="#A8B4C0" stroke-width="2" stroke-linecap="round"/><path d="M511 231L523 241L511 251" fill="none" stroke="#A8B4C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="546" y="57" width="607" height="245" rx="18" fill="#F4F7F9" stroke="#DDE3E8" stroke-width="1"/><text x="578" y="92" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="680" fill="#303843">复制到剪贴板</text><rect x="578" y="112" width="540" height="50" rx="10" fill="#FFFFFF" stroke="#E0E5EA" stroke-width="1"/><text x="598" y="143" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#1A7EA7">主播名</text><text x="771" y="143" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#1A7EA7">UID</text><text x="938" y="143" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#1A7EA7">BV号</text><path d="M747 121L747 153" fill="none" stroke="#E1E6EA" stroke-width="1" stroke-linecap="round"/><path d="M914 121L914 153" fill="none" stroke="#E1E6EA" stroke-width="1" stroke-linecap="round"/><text x="578" y="198" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Cascadia Code, Consolas, monospace" font-size="16" font-weight="650" fill="#8994A0">Tab</text><path d="M629 192L710 192" fill="none" stroke="#AAB4BE" stroke-width="2" stroke-linecap="round"/><text x="724" y="198" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Cascadia Code, Consolas, monospace" font-size="18" font-weight="620" fill="#303843">UID</text><path d="M774 192L855 192" fill="none" stroke="#AAB4BE" stroke-width="2" stroke-linecap="round"/><text x="870" y="198" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#8994A0">空列</text><path d="M923 192L1000 192" fill="none" stroke="#AAB4BE" stroke-width="2" stroke-linecap="round"/><text x="1012" y="198" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Cascadia Code, Consolas, monospace" font-size="18" font-weight="620" fill="#303843">BV</text><rect x="578" y="228" width="227" height="32" rx="16" fill="#E3F5EE"/><text x="691.5" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="650" fill="#237A57">复制成功后可直接粘贴</text>
</svg>
